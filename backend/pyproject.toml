[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-studio-backend"
version = "0.1.0"
description = "FastAPI Backend for Agent Studio with Global Tools, MCP Client, and OpenAI Integration"
authors = [{ name = "Senior Backend Engineer" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "aiomysql>=0.2.0",
    "cryptography>=42.0.0",
    "psycopg2-binary>=2.9.9",
    "openai>=1.14.0",
    "httpx>=0.27.0",
    "httpx-sse>=0.4.0",
    "python-dotenv>=1.0.1",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
